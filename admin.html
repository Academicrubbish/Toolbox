<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 资源消耗统计</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; }

    /* 顶部栏 */
    .topbar { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 14px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
    .topbar h1 { font-size: 17px; font-weight: 600; color: #1a1a1a; }
    .topbar .ctrl { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .topbar select, .topbar button { height: 34px; padding: 0 12px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; font-size: 13px; cursor: pointer; outline: none; }
    .topbar button.primary { background: #007aff; color: #fff; border-color: #007aff; }
    .topbar button.primary:hover { background: #006ee6; }
    .topbar button:hover { border-color: #007aff; }
    .topbar .gen-time { font-size: 12px; color: #999; }

    .wrap { max-width: 1240px; margin: 0 auto; padding: 20px; }

    /* 总览卡 */
    .ov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .ov-card { background: #fff; border-radius: 10px; padding: 16px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .ov-card .ov-title { font-size: 13px; color: #999; margin-bottom: 10px; }
    .ov-card .ov-cost { font-size: 26px; font-weight: 700; color: #1a1a1a; margin-bottom: 12px; }
    .ov-card .ov-cost small { font-size: 13px; color: #999; font-weight: 400; }
    .ov-card .ov-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
    .ov-card .ov-row { font-size: 12px; color: #666; }
    .ov-card .ov-row b { display: block; font-size: 15px; color: #333; font-weight: 600; margin-top: 2px; }
    .ov-card.hl { border-left: 3px solid #007aff; }

    /* 通用区块 */
    .panel { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .panel h2 { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .panel h2 .sub { font-size: 12px; color: #999; font-weight: 400; }

    .table-scroll { width: 100%; overflow-x: auto; }
    .pricing-meta { display: flex; justify-content: space-between; gap: 12px; margin: -4px 0 12px; color: #888; font-size: 12px; }
    .pricing-meta .verified { color: #248f4d; }
    .model-cell { white-space: nowrap; }
    .model-cell strong { display: block; color: #222; }
    .model-cell span { color: #999; font-size: 11px; }
    .price-value { font-variant-numeric: tabular-nums; font-weight: 600; color: #333; white-space: nowrap; }
    .price-source { color: #007aff; text-decoration: none; white-space: nowrap; }
    .price-source:hover { text-decoration: underline; }

    .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-2 > *, .grid-3 > * { min-width: 0; }
    .chart-box { position: relative; height: 260px; }
    .chart-box.sm { height: 200px; }

    /* 表格 */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #f0f0f0; }
    th { color: #999; font-weight: 500; font-size: 12px; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:hover td { background: #fafafa; }
    .uid { color: #999; font-size: 11px; }
    .tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; }
    .tag.ok { background: #e6f7ed; color: #30be64; }
    .tag.err { background: #fdecea; color: #e8402f; }
    .tag.fn-learn_note { background: #eef6ff; color: #3b82f6; }
    .tag.fn-embedding { background: #ecfdf5; color: #059669; }
    .tag.fn-embedding_search { background: #f0fdfa; color: #0f766e; }
    .tag.fn-ocr { background: #fff7e6; color: #d9822b; }
    .tag.fn-wechat_article { background: #f3e8ff; color: #8b5cf6; }

    .empty { text-align: center; color: #bbb; padding: 30px 0; font-size: 13px; }
    .alert-item { padding: 9px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    .alert-item:last-child { border-bottom: none; }
    .alert-item .a-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .alert-item .a-msg { color: #555; }
    .alert-item.critical .a-msg { color: #e8402f; }
    .lvl { font-size: 11px; padding: 1px 6px; border-radius: 4px; }
    .lvl.warn { background: #fff7e6; color: #d9822b; }
    .lvl.critical { background: #fdecea; color: #e8402f; }
    .a-time { color: #bbb; font-size: 11px; }

    .footer { text-align: center; color: #bbb; font-size: 12px; padding: 20px 0 30px; }
    .footer a { color: #bbb; }
    .price-note { font-size: 11px; color: #aaa; margin-top: 8px; line-height: 1.7; }

    /* 登录态 */
    .login-wrap { max-width: 380px; margin: 80px auto; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,.06); text-align: center; }
    .login-wrap h1 { font-size: 19px; margin-bottom: 6px; }
    .login-wrap p { font-size: 13px; color: #999; margin-bottom: 20px; }
    .login-wrap input { width: 100%; height: 40px; border: 1px solid #d9d9d9; border-radius: 8px; padding: 0 14px; font-size: 14px; outline: none; margin-bottom: 12px; }
    .login-wrap input:focus { border-color: #007aff; }
    .login-wrap button { width: 100%; height: 40px; background: #007aff; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .login-wrap .err { color: #e8402f; font-size: 12px; margin-top: 10px; min-height: 16px; }

    .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 18px; border-radius: 6px; font-size: 13px; z-index: 100; display: none; }

    @media screen and (max-width: 980px) {
      .ov-grid { grid-template-columns: repeat(2, 1fr); }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
    @media screen and (max-width: 520px) {
      .wrap { padding: 12px; }
      .ov-grid { grid-template-columns: 1fr; }
      .topbar { padding: 12px; flex-wrap: wrap; gap: 8px; }
      .topbar h1 { flex: 1 0 100%; }
      .topbar .ctrl { width: 100%; margin-left: 0; flex-wrap: wrap; }
      .topbar .gen-time { flex: 1 0 100%; }
      .topbar select { flex: 1; min-width: 0; }
      .pricing-meta { flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>

  <!-- 登录态 -->
  <div id="state-login" class="login-wrap">
    <h1>AI 资源消耗统计</h1>
    <p>请输入管理密钥</p>
    <input id="login-key" type="password" placeholder="管理密钥" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">进入</button>
    <div id="login-err" class="err"></div>
  </div>

  <!-- 仪表盘 -->
  <div id="state-dash" style="display:none;">
    <div class="topbar">
      <h1>📊 AI 资源消耗统计</h1>
      <div class="ctrl">
        <span class="gen-time" id="gen-time"></span>
        <select id="sel-days" onchange="loadStats()">
          <option value="7">近 7 天</option>
          <option value="30" selected>近 30 天</option>
          <option value="90">近 90 天</option>
          <option value="180">近 180 天</option>
        </select>
        <button onclick="loadStats()">刷新</button>
        <button onclick="doLogout()">退出</button>
      </div>
    </div>

    <div class="wrap">
      <!-- 区块1：总览 -->
      <div class="ov-grid" id="ov-grid"></div>

      <!-- 区块2：计费基准 -->
      <div class="panel">
        <h2>模型计费基准 <span class="sub">与后端费用计算使用同一份配置</span></h2>
        <div class="pricing-meta" id="pricing-meta"></div>
        <div class="table-scroll" id="pricing-table"></div>
      </div>

      <!-- 区块3：趋势 -->
      <div class="panel">
        <h2>消耗趋势 <span class="sub">每日 Token / 预估费用</span></h2>
        <div class="chart-box"><canvas id="chart-trend"></canvas></div>
      </div>

      <!-- 区块4：消耗排行 -->
      <div class="grid-2">
        <div class="panel">
          <h2>用户消耗排行 <span class="sub">Top 10（按费用）</span></h2>
          <div id="rank-user"></div>
        </div>
        <div class="panel">
          <h2>功能分布 <span class="sub">按费用</span></h2>
          <div class="chart-box sm"><canvas id="chart-func"></canvas></div>
        </div>
        <div class="panel">
          <h2>模型分布 <span class="sub">按费用</span></h2>
          <div class="chart-box sm"><canvas id="chart-model"></canvas></div>
        </div>
      </div>

      <!-- 区块5：告警 + 明细 -->
      <div class="grid-3">
        <div class="panel">
          <h2>告警记录 <span class="sub">最近 20 条</span></h2>
          <div id="alert-list"></div>
        </div>
        <div class="panel">
          <h2>最近调用明细 <span class="sub">最近 50 条</span></h2>
          <div id="recent-list" style="max-height:360px;overflow:auto;"></div>
        </div>
      </div>

      <div class="footer">
        <div>Toolbox · AI 资源管理台</div>
        <div class="price-note" id="price-note">费用加载中……</div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // ====== 配置 ======
    var API_BASE = 'http://api.coptis.top';  // URL 化云函数域名（暂未配 SSL，用 http；配好证书后改回 https）
    var KEY_STORE = 'ai_admin_key';

    var FN_NAME = {
      learn_note: '学习辅导',
      ocr: '图片OCR',
      wechat_article: '文章解析',
      embedding: '笔记向量化',
      embedding_search: '语义搜索'
    };
    var ALERT_NAME = { single_burst: '单次异常', daily_quota: '日刷量', error_rate: '失败率' };

    var trendChart, funcChart, modelChart;

    // ====== 工具 ======
    function $(id) { return document.getElementById(id); }
    function money(n) {
      var value = Number(n) || 0;
      if (value === 0) return '¥0.00';
      if (Math.abs(value) < 0.01) return '¥' + value.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
      return '¥' + value.toFixed(2);
    }
    function num(n) { return (n || 0).toLocaleString('zh-CN'); }
    function toast(msg) {
      var t = $('toast'); t.textContent = msg; t.style.display = 'block';
      setTimeout(function () { t.style.display = 'none'; }, 1800);
    }
    function fmtTime(ts) {
      if (!ts) return '';
      var d = new Date(ts);
      var pad = function (n) { return String(n).padStart(2, '0'); };
      return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    // ====== 登录态 ======
    function checkLogin() {
      var key = localStorage.getItem(KEY_STORE);
      if (key) { showDash(); loadStats(); }
      else { showLogin(); }
    }
    function showLogin() {
      $('state-login').style.display = 'block';
      $('state-dash').style.display = 'none';
    }
    function showDash() {
      $('state-login').style.display = 'none';
      $('state-dash').style.display = 'block';
    }
    function doLogin() {
      var key = $('login-key').value.trim();
      if (!key) { $('login-err').textContent = '请输入密钥'; return; }
      localStorage.setItem(KEY_STORE, key);
      $('login-err').textContent = '';
      $('login-key').value = '';
      showDash();
      loadStats();
    }
    function doLogout() {
      localStorage.removeItem(KEY_STORE);
      showLogin();
    }

    // ====== 加载数据 ======
    async function loadStats() {
      var key = localStorage.getItem(KEY_STORE);
      if (!key) { showLogin(); return; }
      var days = $('sel-days').value;
      var url = API_BASE + '/getAiStats?key=' + encodeURIComponent(key) + '&days=' + days;
      try {
        var res = await fetch(url, { headers: { 'Content-Type': 'application/json' } });
        if (res.status === 403) {
          $('login-err').textContent = '密钥错误';
          doLogout();
          return;
        }
        var json = await res.json();
        if (json.code !== 0) { toast(json.message || '加载失败'); return; }
        render(json.data);
        toast('已更新');
      } catch (e) {
        toast('网络错误，请检查 API 地址');
      }
    }

    // ====== 渲染 ======
    function render(d) {
      renderOverview(d);
      renderPricing(d.pricing);
      renderTrend(d.trend);
      renderUser(d.byUser);
      renderPie('chart-func', 'funcChart', d.byFunction);
      renderPie('chart-model', 'modelChart', d.byModel);
      renderAlerts(d.alerts);
      renderRecent(d.recent);
      $('gen-time').textContent = '统计于 ' + fmtTime(d.generatedAt);
    }

    function renderOverview(d) {
      var o = d.overview;
      var span = d.days;
      var cards = [
        { key: '今日', data: o.today, hl: true },
        { key: '近 7 天', data: o.d7 },
        { key: '近 30 天', data: o.d30 }
      ];
      if (span !== 7 && span !== 30) cards.push({ key: '近 ' + span + ' 天（所选）', data: o.all });
      $('ov-grid').innerHTML = cards.map(function (c) {
        var x = c.data;
        return '<div class="ov-card ' + (c.hl ? 'hl' : '') + '">' +
          '<div class="ov-title">' + c.key + '</div>' +
          '<div class="ov-cost">' + money(x.cost) + ' <small>预估费用</small></div>' +
          '<div class="ov-rows">' +
            '<div class="ov-row">总 Token<b>' + num(x.tokens) + '</b></div>' +
            '<div class="ov-row">输入 Token<b>' + num(x.inputTokens) + '</b></div>' +
            '<div class="ov-row">输出 Token<b>' + num(x.outputTokens) + '</b></div>' +
            '<div class="ov-row">调用<b>' + num(x.calls) + '</b></div>' +
            '<div class="ov-row">活跃用户<b>' + num(x.users) + '</b></div>' +
            '<div class="ov-row">成功率<b>' + x.successRate + '%</b></div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function renderPricing(pricing) {
      if (!pricing || !pricing.models) {
        $('pricing-meta').textContent = '未获取到计费配置';
        $('pricing-table').innerHTML = '<div class="empty">暂无定价数据</div>';
        return;
      }
      var verified = pricing.models.filter(function (p) { return p.official; });
      var estimates = pricing.models.filter(function (p) { return !p.official; }).length;
      $('pricing-meta').innerHTML = '<span class="verified">✓ 已核对官方公开原价</span>' +
        '<span>更新日期：' + escapeHtml(pricing.updatedAt || '-') + '　单位：' + escapeHtml(pricing.unit || '') + '</span>';

      var html = '<table><thead><tr><th>模型</th><th>输入区间</th><th class="num">输入单价</th><th class="num">输出单价</th><th>依据</th></tr></thead><tbody>';
      verified.forEach(function (p) {
        (p.tiers || []).forEach(function (tier, index) {
          html += '<tr><td class="model-cell"><strong>' + escapeHtml(p.model) + '</strong>' +
            '<span>' + escapeHtml(p.provider || '') + '</span></td>' +
            '<td>' + escapeHtml(tier.label || '') + '</td>' +
            '<td class="num price-value">¥' + num(tier.input) + '</td>' +
            '<td class="num price-value">¥' + num(tier.output) + '</td>' +
            '<td>' + (index === 0 && p.source
              ? '<a class="price-source" href="' + escapeHtml(p.source) + '" target="_blank" rel="noopener noreferrer">官方价格</a>'
              : '') + '</td></tr>';
        });
      });
      html += '</tbody></table>';
      $('pricing-table').innerHTML = html;
      $('price-note').innerHTML = '费用按输入、输出 Token 分别计价，并按单次请求输入长度选择阶梯；不含免费额度、活动优惠、缓存或 Batch 折扣。' +
        (estimates ? '<br>历史记录中的其他 ' + estimates + ' 个模型仍使用兼容估值；所有金额仅供资源监控，请以供应商实际账单为准。' : '<br>所有金额仅供资源监控，请以供应商实际账单为准。');
    }

    function renderTrend(trend) {
      if (trendChart) trendChart.destroy();
      if (!trend || !trend.length) { return; }
      var labels = trend.map(function (t) { return t.date.slice(5); });
      var tokens = trend.map(function (t) { return t.tokens; });
      var costs = trend.map(function (t) { return t.cost; });
      trendChart = new Chart($('chart-trend'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            { label: 'Token', data: tokens, borderColor: '#007aff', backgroundColor: 'rgba(0,122,255,.1)', yAxisID: 'y', tension: .3, fill: true },
            { label: '费用(元)', data: costs, borderColor: '#30be64', backgroundColor: 'rgba(48,190,100,.1)', yAxisID: 'y1', tension: .3 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            y: { type: 'linear', position: 'left', title: { display: true, text: 'Token' } },
            y1: { type: 'linear', position: 'right', title: { display: true, text: '元' }, grid: { drawOnChartArea: false } }
          },
          plugins: { legend: { position: 'top' } }
        }
      });
    }

    function renderUser(list) {
      var top = (list || []).slice(0, 10);
      if (!top.length) { $('rank-user').innerHTML = '<div class="empty">暂无数据</div>'; return; }
      var html = '<table><thead><tr><th>用户</th><th class="num">调用</th><th class="num">Token</th><th class="num">费用</th></tr></thead><tbody>';
      top.forEach(function (u, i) {
        var name = u.userName || ('用户' + (i + 1));
        html += '<tr><td>' + escapeHtml(name) + '<br><span class="uid">' + escapeHtml(u.openid || '') + '</span></td>' +
          '<td class="num">' + num(u.calls) + '</td>' +
          '<td class="num">' + num(u.tokens) + '</td>' +
          '<td class="num">' + money(u.cost) + '</td></tr>';
      });
      html += '</tbody></table>';
      $('rank-user').innerHTML = html;
    }

    function renderPie(canvasId, chartVar, list) {
      if (window[chartVar]) window[chartVar].destroy();
      if (!list || !list.length) { return; }
      var palette = ['#007aff', '#30be64', '#d9822b', '#8b5cf6', '#e8402f', '#14b8a6'];
      window[chartVar] = new Chart($(canvasId), {
        type: 'doughnut',
        data: {
          labels: list.map(function (x) { return FN_NAME[x.name] || x.name; }),
          datasets: [{
            data: list.map(function (x) { return x.cost; }),
            backgroundColor: palette,
            borderWidth: 2, borderColor: '#fff'
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '60%',
          plugins: {
            legend: { position: 'right', labels: { font: { size: 12 } } },
            tooltip: { callbacks: { label: function (c) { return c.label + ': ¥' + c.parsed.toFixed(2); } } }
          }
        }
      });
    }

    function renderAlerts(list) {
      if (!list || !list.length) { $('alert-list').innerHTML = '<div class="empty">无告警 🎉</div>'; return; }
      var html = list.map(function (a) {
        return '<div class="alert-item ' + (a.level || '') + '">' +
          '<div class="a-head"><span><span class="lvl ' + (a.level || 'warn') + '">' + (ALERT_NAME[a.rule] || a.rule) + '</span></span>' +
          '<span class="a-time">' + fmtTime(a.create_time) + '</span></div>' +
          '<div class="a-msg">' + escapeHtml(a.message || '') + '</div>' +
          (a.openid ? '<div class="uid">' + escapeHtml(a.userName || a.openid) + '</div>' : '') +
        '</div>';
      }).join('');
      $('alert-list').innerHTML = html;
    }

    function renderRecent(list) {
      if (!list || !list.length) { $('recent-list').innerHTML = '<div class="empty">暂无数据</div>'; return; }
      var html = '<div class="table-scroll"><table><thead><tr><th>时间</th><th>功能</th><th>模型</th><th class="num">输入</th><th class="num">输出</th><th class="num">总计</th><th class="num">费用</th><th>状态</th></tr></thead><tbody>';
      list.forEach(function (l) {
        html += '<tr>' +
          '<td>' + fmtTime(l.time) + '</td>' +
          '<td><span class="tag fn-' + (l.function || '') + '">' + (FN_NAME[l.function] || l.function) + '</span></td>' +
          '<td>' + escapeHtml(l.model || '') + '</td>' +
          '<td class="num">' + num(l.inputTokens) + '</td>' +
          '<td class="num">' + num(l.outputTokens) + '</td>' +
          '<td class="num">' + num(l.tokens) + '</td>' +
          '<td class="num">' + money(l.cost) + '</td>' +
          '<td title="' + escapeHtml(l.error_msg || '') + '"><span class="tag ' + (l.status === 'success' ? 'ok' : 'err') + '">' + (l.status === 'success' ? '成功' : '失败') + '</span></td>' +
        '</tr>';
      });
      html += '</tbody></table></div>';
      $('recent-list').innerHTML = html;
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    checkLogin();
  </script>
</body>
</html>
